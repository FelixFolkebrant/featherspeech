[project]
name = "vc-tts"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pocket-tts==4.0.1", "torch>=2.5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3",
    "onnxruntime>=1.23,<2", "phonemizer>=3.3,<4", "espeakng-loader>=0.2.4,<1", "huggingface-hub>=0.28,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.12"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
